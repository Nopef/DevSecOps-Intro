- rule: Possible Cryptominer Activity
  desc: Detect miner process names or mining-pool port connections
  condition: container and (proc.name in (xmrig, ethminer, cgminer, claymore) or (evt.type=connect and fd.sport in (3333, 4444, 5555, 7777, 14444, 19999, 45700)))
  output: "Possible cryptominer activity (container=%container.name proc=%proc.name connection=%fd.name sport=%fd.sport)"
  priority: CRITICAL
  tags: [container, mitre_execution, mitre_command_and_control]
